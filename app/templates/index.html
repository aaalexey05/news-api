<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление новостями</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2d3142;
            --secondary: #f5f5f5;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --border: #e5e7eb;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header-section {
            margin-bottom: 50px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            letter-spacing: -1px;
        }

        .btn-add-news {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            border: none;
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-add-news::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .btn-add-news:hover::before {
            left: 100%;
        }

        .btn-add-news:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
        }

        .btn-add-news:active {
            transform: translateY(-2px);
        }

        .alert {
            border-radius: 12px;
            border: none;
            animation: slideIn 0.4s ease-out;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%);
            color: #065f46;
            border-left: 4px solid var(--success);
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(239, 68, 68, 0.05) 100%);
            color: #991b1b;
            border-left: 4px solid var(--danger);
        }

        .loader {
            display: none;
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.3s ease-out;
        }

        .loader .spinner-border {
            color: var(--accent);
            width: 3rem;
            height: 3rem;
            border-width: 4px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 32px;
            animation: fadeIn 0.6s ease-out;
        }

        .news-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1.5px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            cursor: pointer;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .news-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light), var(--accent-dark));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .news-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.12);
            border-color: var(--accent-light);
        }

        .news-card:hover::after {
            transform: scaleX(1);
        }

        .card-body {
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 0;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.3;
            margin: 0;
            word-break: break-word;
        }

        .card-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-subtitle::before {
            content: '📅';
            font-size: 0.9rem;
        }

        .card-text {
            color: var(--text-secondary);
            line-height: 1.7;
            flex-grow: 1;
            margin: 12px 0 16px 0;
            font-size: 0.95rem;
            font-weight: 400;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1.5px solid var(--border);
        }

        .btn-action {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .btn-action::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
            z-index: 1;
        }

        .btn-action:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-edit {
            background: white;
            color: var(--accent);
            border-color: var(--accent);
        }

        .btn-edit:hover {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: white;
            border-color: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-delete {
            background: white;
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-delete:hover {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
            color: white;
            border-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 20px;
            color: var(--text-secondary);
            animation: fadeIn 0.5s ease-out;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        .empty-state-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .empty-state-subtext {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .pagination-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .pagination {
            gap: 10px;
            flex-wrap: wrap;
        }

        .page-item .page-link {
            border-radius: 10px;
            border: 1.5px solid var(--border);
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            min-width: 44px;
            padding: 10px 12px;
            background: white;
        }

        .page-item .page-link:hover {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            border-color: var(--accent-dark);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .page-item.active .page-link {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            border-color: var(--accent-dark);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .page-item.disabled .page-link {
            opacity: 0.4;
            cursor: not-allowed;
            background: var(--secondary);
        }

        .modal-content {
            border: none;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .modal-header {
            border-bottom: none;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            padding: 28px;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 800;
            color: white;
        }

        .modal-body {
            padding: 32px;
            background: white;
        }

        .form-label {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .form-control {
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: #fafbfc;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: white;
        }

        .form-control::placeholder {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .modal-footer {
            border-top: 1.5px solid var(--border);
            background: #fafbfc;
            padding: 20px 28px;
            gap: 12px;
        }

        .btn-secondary {
            background-color: white;
            border: 1.5px solid var(--border);
            color: var(--text-primary);
            font-weight: 700;
            border-radius: 12px;
            padding: 11px 28px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-size: 0.85rem;
        }

        .btn-secondary:hover {
            background-color: var(--secondary);
            border-color: var(--accent-light);
            color: var(--accent);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            border: none;
            color: white;
            font-weight: 700;
            border-radius: 12px;
            padding: 11px 32px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-size: 0.85rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
            border: none;
            color: white;
            font-weight: 700;
            border-radius: 12px;
            padding: 11px 28px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
        }

        .btn-close {
            opacity: 0.7;
            transition: all 0.3s ease;
            filter: brightness(0) invert(1);
        }

        .btn-close:hover {
            opacity: 1;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 16px;
            }

            .header-content h1 {
                font-size: 2.2rem;
            }

            .header-wrapper {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-add-news {
                width: 100%;
                text-align: center;
            }

            .news-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .card-actions {
                flex-direction: column;
            }

            .btn-action {
                width: 100%;
            }

            .modal-content {
                border-radius: 16px;
            }

            .empty-state-icon {
                font-size: 3rem;
            }

            .empty-state-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="header-section">
        <div class="header-wrapper">
            <div class="header-content">
                <h1>Новости</h1>
            </div>
            <button class="btn-add-news" onclick="openModal()">+ Добавить новость</button>
        </div>
    </div>

    <div id="alertArea"></div>

    <div id="loader" class="loader">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Загрузка...</span>
        </div>
    </div>

    <div id="newsList" class="news-grid"></div>

    <div class="pagination-wrapper">
        <nav>
            <ul class="pagination" id="pagination"></ul>
        </nav>
    </div>
</div>

<!-- Modal для добавления/редактирования новости -->
<div class="modal fade" id="newsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Новость</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="newsForm">
                    <input type="hidden" id="newsId">
                    <div class="mb-3">
                        <label for="newsTitle" class="form-label">Заголовок *</label>
                        <input type="text" class="form-control" id="newsTitle" required maxlength="255" placeholder="Введите заголовок новости...">
                        <div class="invalid-feedback" id="titleError"></div>
                    </div>
                    <div class="mb-3">
                        <label for="newsContent" class="form-label">Содержание</label>
                        <textarea class="form-control" id="newsContent" rows="6" placeholder="Введите содержание новости..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn-primary" onclick="saveNews()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal для подтверждения удаления -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Удаление новости</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Вы уверены, что хотите удалить эту новость? Это действие невозможно отменить.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn-danger" id="confirmDeleteBtn">Удалить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- Конфигурация ---
    const API_URL = '/api/news';
    let currentPage = 1;
    let currentDeleteId = null;

    // Инициализация модальных окон Bootstrap
    const newsModal = new bootstrap.Modal(document.getElementById('newsModal'));
    const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

    // --- Загрузка данных ---
    document.addEventListener('DOMContentLoaded', () => loadNews(1));

    async function loadNews(page) {
        currentPage = page;
        toggleLoader(true);
        try {
            const response = await fetch(`${API_URL}?page=${page}&per_page=6`);
            if (!response.ok) throw new Error('Ошибка сети');
            const data = await response.json();
            renderNews(data.news);
            renderPagination(data);
        } catch (error) {
            showAlert('Ошибка при загрузке новостей', 'danger');
        } finally {
            toggleLoader(false);
        }
    }

    // --- Рендеринг (Отрисовка) ---
    function renderNews(newsList) {
        const container = document.getElementById('newsList');
        container.innerHTML = '';
        if (newsList.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <div class="empty-state-text">Новостей пока нет</div>
                    <p class="empty-state-subtext">Создайте первую новость, нажав кнопку «+ Добавить новость»</p>
                </div>
            `;
            return;
        }
        newsList.forEach(news => {
            const date = new Date(news.publication_date).toLocaleString('ru-RU');
            const content = news.content ? (news.content.substring(0, 100) + '...') : '(нет описания)';
            const card = `
                <div class="news-card">
                    <div class="card-body">
                        <h5 class="card-title">${escapeHtml(news.title)}</h5>
                        <h6 class="card-subtitle">${date}</h6>
                        <p class="card-text">${escapeHtml(content)}</p>
                        <div class="card-actions">
                            <button class="btn-action btn-edit" onclick="openEdit(${news.id})">✏️ Редактировать</button>
                            <button class="btn-action btn-delete" onclick="confirmDelete(${news.id})">🗑️ Удалить</button>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    function renderPagination(meta) {
        const pag = document.getElementById('pagination');
        pag.innerHTML = '';

        if (meta.total_pages <= 1) return;

        // Кнопка Назад
        pag.innerHTML += `
            <li class="page-item ${meta.current_page === 1 ? 'disabled' : ''}">
                <button class="page-link" onclick="loadNews(${meta.current_page - 1})">← Назад</button>
            </li>
        `;

        // Номера страниц
        for (let i = 1; i <= meta.total_pages; i++) {
            pag.innerHTML += `
                <li class="page-item ${i === meta.current_page ? 'active' : ''}">
                    <button class="page-link" onclick="loadNews(${i})">${i}</button>
                </li>
            `;
        }

        // Кнопка Вперед
        pag.innerHTML += `
            <li class="page-item ${meta.current_page === meta.total_pages ? 'disabled' : ''}">
                <button class="page-link" onclick="loadNews(${meta.current_page + 1})">Вперед →</button>
            </li>
        `;
    }

    // --- Действия (CRUD) ---
    function openModal() {
        document.getElementById('newsForm').reset();
        document.getElementById('newsId').value = '';
        document.getElementById('modalTitle').innerText = 'Добавить новость';
        newsModal.show();
    }

    async function openEdit(id) {
        try {
            const response = await fetch(`${API_URL}/${id}`);
            const news = await response.json();
            document.getElementById('newsId').value = news.id;
            document.getElementById('newsTitle').value = news.title;
            document.getElementById('newsContent').value = news.content || '';
            document.getElementById('modalTitle').innerText = 'Редактировать новость';
            newsModal.show();
        } catch (e) {
            showAlert('Не удалось загрузить новость', 'danger');
        }
    }

    async function saveNews() {
        const id = document.getElementById('newsId').value;
        const title = document.getElementById('newsTitle').value;
        const content = document.getElementById('newsContent').value;
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;
        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content })
            });
            const resData = await response.json();
            if (!response.ok) {
                if (resData.error) {
                    if (typeof resData.error === 'string') {
                        alert(resData.error);
                    } else {
                        let msg = '';
                        for (const [field, errors] of Object.entries(resData.error)) {
                            msg += `${field}: ${errors.join(', ')}\n`;
                        }
                        alert(msg || 'Ошибка валидации');
                    }
                }
                return;
            }
            newsModal.hide();
            showAlert(id ? 'Новость обновлена' : 'Новость создана', 'success');
            loadNews(currentPage);
        } catch (error) {
            console.error(error);
            showAlert('Ошибка сервера', 'danger');
        }
    }

    function confirmDelete(id) {
        currentDeleteId = id;
        deleteModal.show();
    }

    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
        if (!currentDeleteId) return;

        try {
            const response = await fetch(`${API_URL}/${currentDeleteId}`, { method: 'DELETE' });
            if (response.ok) {
                deleteModal.hide();
                showAlert('Новость удалена', 'success');
                loadNews(1);
            } else {
                showAlert('Ошибка при удалении', 'danger');
            }
        } catch (e) {
            showAlert('Ошибка соединения', 'danger');
        }
    });

    // --- Утилиты ---
    function toggleLoader(show) {
        document.getElementById('loader').style.display = show ? 'block' : 'none';
    }

    function showAlert(message, type) {
        const alertArea = document.getElementById('alertArea');
        alertArea.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;
        setTimeout(() => { alertArea.innerHTML = ''; }, 3000);
    }

    function escapeHtml(text) {
        if (!text) return "";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
